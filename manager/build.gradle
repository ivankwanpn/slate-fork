plugins {
    id('com.android.application')
    id('org.jetbrains.kotlin.android')
}

android {
    namespace 'moe.shizuku.manager'

    defaultConfig {
        applicationId "io.github.ivankwanpn.slate"
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName
    }

    sourceSets {
        main {
            manifest.srcFile 'src/slate/AndroidManifest.xml'
            java.srcDirs = ['src/slate/java']
            res.srcDirs = ['src/slate/res']
            aidl.srcDirs = ['src/main/aidl']
        }
    }

    buildFeatures {
        buildConfig false
        aidl true
    }

    signingConfigs {
        sign
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.sign
        }
        release {
            signingConfig signingConfigs.sign
            minifyEnabled true
            shrinkResources true
            vcsInfo.include false
            proguardFiles 'slate-proguard-rules.pro'
        }
    }

    kotlinOptions {
        jvmTarget = "21"
    }

    lint {
        checkReleaseBuilds false
    }
}

android.applicationVariants.configureEach { variant ->
    variant.outputs.configureEach {
        outputFileName = "Slate-${variant.versionName}-${variant.name}.apk"
    }
}

apply from: rootProject.file('signing.gradle')

dependencies {
    implementation project(':api')
    implementation project(':provider')
}
